app:
  description: gleanmem 记忆增强 Agent
  icon: 🧠
  icon_background: '#1C64F2'
  mode: advanced-chat
  name: 记忆增强助手
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: [.JPG,.JPEG,.PNG,.GIF,.WEBP,.SVG]
      allowed_file_types: [image]
      allowed_file_upload_methods: [local_file,remote_url]
      enabled: false
      number_limits: 3
    opening_statement: 我是业务助手，拥有长期记忆能力。我会记住你告诉我的规则和偏好。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false

  graph:
    edges:
      # Start → Agent
      - data:
          isInLoop: false
          sourceType: start
          targetType: agent
        id: start-agent
        source: start
        sourceHandle: source
        target: agent
        targetHandle: target
        type: custom
        zIndex: 0

      # Agent → Flush
      - data:
          isInLoop: false
          sourceType: agent
          targetType: code
        id: agent-flush
        source: agent
        sourceHandle: source
        target: flush
        targetHandle: target
        type: custom
        zIndex: 0

      # Flush → Answer
      - data:
          isInLoop: false
          sourceType: code
          targetType: answer
        id: flush-answer
        source: flush
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        zIndex: 0

    nodes:
      # === Start ===
      - data:
          title: 开始
          type: start
          variables: []
        height: 73
        id: start
        position:
          x: 80
          y: 282
        type: custom
        width: 242

      # === Agent (带 MCP 工具) ===
      - data:
          agent_binding:
            agent_id: 019f651b-7a3a-782c-bf0e-563822bfb5e0
            binding_type: inline_agent
            current_snapshot_id: 019f651b-d3f8-7307-b1ce-02affa2efbc4
          agent_node_kind: dify_agent
          agent_task: ''
          title: Agent
          type: agent
          version: '2'
        height: 118
        id: agent
        position:
          x: 400
          y: 282
        type: custom
        width: 242

      # === Flush HTTP ===
      - data:
          title: Flush 学习管道
          type: code
          variables:
            - value_selector: []
              variable: result
          code_language: python3
          code: |
            import requests
            requests.post(
                "http://10.60.80.165:8765/api/v1/learning/flush",
                json={"agent_id": "5b17f4c7-ae3b-40c2-9d37-990ad83a2036"},
                timeout=10,
            )
          outputs:
            result:
              type: string
              children: null
        height: 90
        id: flush
        position:
          x: 720
          y: 282
        type: custom
        width: 242

      # === Answer ===
      - data:
          answer: '{{#agent.text#}}'
          title: 直接回复
          type: answer
          variables: []
        height: 103
        id: answer
        position:
          x: 1040
          y: 282
        type: custom
        width: 242

    viewport:
      x: 0
      y: 0
      zoom: 1
