[project]
name = "mcp-behavior"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.2",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
# cryptography 45+ 在 macOS x86_64 + Python 3.13 无预编译 wheel,
# 从源码编译需要 Rust 工具链且当前 maturin 与 pyo3 版本不兼容。
# 44 是最后一个有 x86_64 wheel 的主版本。
constraint-dependencies = ["cryptography<45"]

