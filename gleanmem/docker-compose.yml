services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.pg-zhparser
    image: ydm-postgres-zhparser:14
    environment:
      POSTGRES_USER: ydm
      POSTGRES_PASSWORD: ydm
      POSTGRES_DB: ydm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ydm"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
