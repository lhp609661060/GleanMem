[alembic]
script_location = alembic
# 数据库地址由 alembic/env.py 从 settings（YDM_DATABASE_URL / .env）读取，
# 与运行时同一个事实来源；下面这项保留仅为兼容 alembic 自动脚本生成。
sqlalchemy.url = postgresql+asyncpg://ydm:ydm@localhost:5432/ydm

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
