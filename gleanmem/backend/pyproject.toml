[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gleanmem"
version = "0.1.0"
description = "Dify-integrated memory/learning service backed by PostgreSQL + zhparser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mcp>=1.2",
    "starlette>=0.40",
    "httpx>=0.28",
    "openai>=1.0", # for LearningModel LLM mode
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
constraint-dependencies = ["cryptography<45"]

[project.scripts]
gleanmem = "gleanmem.main:main"
gleanmem-distill = "gleanmem.cli.distill:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 全局 async engine 的连接池绑定首个 event loop；必须 session 级共享 loop，
# 否则跨测试复用连接报 "another operation is in progress"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
